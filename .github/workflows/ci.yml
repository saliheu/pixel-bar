name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json
      - run: npm ci
        working-directory: ${{ matrix.package }}
      - run: npm run build
        working-directory: ${{ matrix.package }}

  smoke:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm run build
        working-directory: backend
      - name: Coklu salon izolasyon testleri
        working-directory: backend
        run: |
          PORT=8099 node dist/index.js &
          for i in $(seq 1 30); do
            node -e "require('net').connect(8099,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))" && break
            sleep 1
          done
          node scripts/smoke-multiroom.mjs 8099
