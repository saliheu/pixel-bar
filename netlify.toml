[build]
  base = "frontend"
  # publish yolu base'e GÖRE çözülür; "frontend/dist" yazılırsa
  # Netlify frontend/frontend/dist arar ve deploy patlar.
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
